services:
  postgres:
    image: postgres:16-alpine
    container_name: aquashrimp-postgres-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    volumes:
      - aquashrimp_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aquashrimp-api-prod
    restart: always
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aquashrimp_pgdata_prod:
