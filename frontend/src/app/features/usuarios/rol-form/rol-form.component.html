@if (open) {
  <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-surface-container-lowest w-full max-w-lg rounded-2xl shadow-[0px_8px_32px_rgba(0,95,115,0.12)] border border-tertiary/20 flex flex-col max-h-[90vh]">
      <div class="px-6 py-5 border-b border-outline-variant/30 flex items-center gap-4">
        <div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-primary text-[28px]">key</span>
        </div>
        <div class="flex-1">
          <h2 class="font-headline-md text-headline-md text-on-surface">{{ rol ? 'Editar Rol' : 'Nuevo Rol' }}</h2>
          <p class="font-caption text-caption text-on-surface-variant mt-1">Define el nombre, descripción y permisos de este rol.</p>
        </div>
        <button type="button" (click)="cancelled.emit()" class="p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="p-6 overflow-y-auto flex flex-col gap-4">
        <div class="flex flex-col gap-2">
          <label for="nombre_rol" class="font-data-label text-data-label text-on-surface-variant">Nombre del Rol</label>
          <input
            id="nombre_rol"
            formControlName="nombre_rol"
            placeholder="Ej. Operador de Piscina"
            class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="estado" class="font-data-label text-data-label text-on-surface-variant">Estado</label>
          <select
            id="estado"
            formControlName="estado"
            class="w-full px-4 py-3 appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
          >
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>

        <div class="flex flex-col gap-2">
          <label for="descripcion" class="font-data-label text-data-label text-on-surface-variant">Descripción</label>
          <textarea
            id="descripcion"
            formControlName="descripcion"
            rows="3"
            placeholder="Describe brevemente las responsabilidades de este rol..."
            class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all resize-none"
          ></textarea>
        </div>

        <div class="flex flex-col gap-2">
          <label for="permisos" class="font-data-label text-data-label text-on-surface-variant">Permisos</label>
          <textarea
            id="permisos"
            formControlName="permisos"
            rows="3"
            placeholder="Ej. lectura de piscinas, gestión de alertas..."
            class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all resize-none"
          ></textarea>
          <p class="font-caption text-caption text-on-surface-variant">
            El backend guarda este campo como texto libre; no aplica reglas de acceso por módulo automáticamente.
          </p>
        </div>
      </form>

      <div class="px-6 py-4 border-t border-outline-variant/30 bg-surface-container-lowest flex justify-end gap-3">
        <button type="button" (click)="cancelled.emit()" class="px-6 py-2.5 rounded-full border border-secondary text-secondary font-body-md text-body-md font-medium hover:bg-secondary/5 transition-colors">
          Cancelar
        </button>
        <button
          type="button"
          [disabled]="saving"
          (click)="submit()"
          class="px-6 py-2.5 rounded-full bg-primary text-on-primary font-body-md text-body-md font-medium hover:bg-primary-container transition-colors shadow-sm disabled:opacity-60"
        >
          {{ saving ? 'Guardando...' : 'Guardar Rol' }}
        </button>
      </div>
    </div>
  </div>
}
