@if (open) {
  <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 flex items-center justify-center p-4">
    <div class="bg-surface rounded-xl shadow-[0px_8px_32px_rgba(0,95,115,0.1)] w-full max-w-2xl border border-tertiary/20 flex flex-col z-50 max-h-[90vh]">
      <div class="px-6 py-4 border-b border-outline-variant/30 flex justify-between items-center bg-surface-container-low">
        <h2 class="font-headline-md text-headline-md text-primary">
          {{ recomendacion ? 'Editar Recomendación' : 'Nueva Recomendación de Alimentación' }}
        </h2>
        <button type="button" (click)="cancelled.emit()" class="text-on-surface-variant hover:text-error transition-colors p-2 rounded-full hover:bg-error-container/20">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6">
        <form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="id_piscina" class="block font-caption text-caption text-on-surface-variant mb-1">Piscina</label>
            <select
              id="id_piscina"
              formControlName="id_piscina"
              class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
            >
              <option [value]="0" disabled>Seleccionar piscina</option>
              @for (piscina of piscinas; track piscina.id) {
                <option [value]="piscina.id">{{ piscina.codigo }} — {{ piscina.ubicacion }}</option>
              }
            </select>
          </div>

          <div>
            <label for="cantidad_kg" class="block font-caption text-caption text-on-surface-variant mb-1">Cantidad (kg)</label>
            <input
              id="cantidad_kg"
              type="number"
              step="0.1"
              min="0.1"
              formControlName="cantidad_kg"
              class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-2 font-data-label text-data-label text-on-surface focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
            />
          </div>

          <div>
            <label for="frecuencia" class="block font-caption text-caption text-on-surface-variant mb-1">Frecuencia</label>
            <input
              id="frecuencia"
              formControlName="frecuencia"
              placeholder="Ej: 3 veces al día"
              class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
            />
          </div>

          <div>
            <label for="estado" class="block font-caption text-caption text-on-surface-variant mb-1">Estado</label>
            <select
              id="estado"
              formControlName="estado"
              class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
            >
              <option value="pendiente">Pendiente</option>
              <option value="aplicada">Aplicada</option>
              <option value="rechazada">Rechazada</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label for="criterio" class="block font-caption text-caption text-on-surface-variant mb-1">Criterio</label>
            <textarea
              id="criterio"
              formControlName="criterio"
              rows="2"
              placeholder="Ej: Parámetros óptimos registrados."
              class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-2 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all resize-none"
            ></textarea>
          </div>
        </form>
      </div>

      <div class="px-6 py-4 border-t border-outline-variant/30 bg-surface-container-low flex justify-end gap-3">
        <button type="button" (click)="cancelled.emit()" class="px-5 py-2 rounded-lg font-body-md text-body-md font-medium text-primary border border-outline-variant hover:bg-surface-container transition-colors">
          Cancelar
        </button>
        <button
          type="button"
          [disabled]="saving"
          (click)="submit()"
          class="px-5 py-2 rounded-lg font-body-md text-body-md font-medium text-on-primary bg-primary hover:bg-primary-container shadow-sm transition-colors flex items-center gap-2 disabled:opacity-60"
        >
          <span class="material-symbols-outlined text-sm">save</span>
          {{ saving ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </div>
  </div>
}
