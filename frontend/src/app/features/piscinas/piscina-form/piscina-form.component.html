@if (open) {
  <div class="fixed inset-0 z-[90] flex items-center justify-center bg-inverse-surface/40 p-4">
    <div class="bg-surface rounded-xl shadow-[0px_4px_20px_rgba(0,95,115,0.15)] border border-outline-variant/20 w-full max-w-lg">
      <div class="flex items-center justify-between p-6 border-b border-outline-variant/20">
        <h3 class="font-headline-md text-headline-md text-on-surface">
          {{ piscina ? 'Editar Piscina' : 'Nueva Piscina' }}
        </h3>
        <button type="button" (click)="cancelled.emit()" class="text-on-surface-variant hover:text-primary">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="p-6 flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1">
            <label for="codigo" class="font-caption text-caption text-on-surface-variant">Código</label>
            <input
              id="codigo"
              formControlName="codigo"
              placeholder="P-001"
              class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            />
          </div>
          <div class="space-y-1">
            <label for="estado" class="font-caption text-caption text-on-surface-variant">Estado</label>
            <select
              id="estado"
              formControlName="estado"
              class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            >
              <option value="activa">Activa</option>
              <option value="inactiva">Inactiva</option>
              <option value="mantenimiento">Mantenimiento</option>
            </select>
          </div>
        </div>

        <div class="space-y-1">
          <label for="ubicacion" class="font-caption text-caption text-on-surface-variant">Ubicación</label>
          <input
            id="ubicacion"
            formControlName="ubicacion"
            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
          />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1">
            <label for="area_m2" class="font-caption text-caption text-on-surface-variant">Área (m²)</label>
            <input
              id="area_m2"
              type="number"
              step="0.01"
              formControlName="area_m2"
              class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            />
          </div>
          <div class="space-y-1">
            <label for="profundidad" class="font-caption text-caption text-on-surface-variant">Profundidad (m)</label>
            <input
              id="profundidad"
              type="number"
              step="0.01"
              formControlName="profundidad"
              class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
            />
          </div>
        </div>

        <div class="space-y-1">
          <label for="fecha_inicio_ciclo" class="font-caption text-caption text-on-surface-variant">Fecha de inicio de ciclo</label>
          <input
            id="fecha_inicio_ciclo"
            type="date"
            formControlName="fecha_inicio_ciclo"
            class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary/50"
          />
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button
            type="button"
            (click)="cancelled.emit()"
            class="px-4 py-2 border border-outline-variant text-on-surface-variant rounded-lg hover:bg-surface-container-low transition-colors"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="saving"
            class="px-4 py-2 bg-primary text-on-primary rounded-lg hover:bg-primary-container transition-colors disabled:opacity-60"
          >
            {{ saving ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
