<div class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen">
  <aside
    class="bg-surface dark:bg-surface-dim shadow-[0px_4px_20px_rgba(0,95,115,0.05)] dark:shadow-none fixed left-0 top-0 h-full flex flex-col py-6 w-[280px] z-50 border-r border-outline-variant/10"
  >
    <div class="px-6 mb-8 flex items-center gap-4">
      <div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-on-primary-container">water_drop</span>
      </div>
      <div>
        <h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">
          AquaShrimp
        </h1>
        <p class="font-caption text-caption text-on-surface-variant">Management System</p>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-4 flex flex-col gap-1">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-primary dark:text-primary-fixed-dim bg-secondary-container/20 border-l-4 border-primary dark:border-primary-fixed-dim"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high/10 transition-all duration-200 ease-in-out"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="ml-[280px] min-h-screen flex flex-col">
    <header
      class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant/30 flex justify-between items-center w-full px-container-padding h-16 sticky top-0 z-40"
    >
      <h2 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim hidden md:block">
        AquaShrimp MIS
      </h2>
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs"
        >
          {{ initials() }}
        </div>
        <div class="hidden sm:flex flex-col leading-tight">
          <span class="font-body-md text-body-md text-on-surface-variant font-medium">{{ correo() }}</span>
          @if (rolNombre()) {
            <span class="font-caption text-caption text-outline">{{ rolNombre() }}</span>
          }
        </div>
        <button
          type="button"
          (click)="logout()"
          class="p-2 text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-highest/10 rounded-full transition-transform duration-150 active:scale-95 flex items-center justify-center"
          title="Cerrar sesión"
        >
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <main class="flex-1 p-container-padding flex flex-col gap-8">
      <router-outlet />
    </main>
  </div>
</div>
