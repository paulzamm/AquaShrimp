@if (open) {
  <div class="fixed inset-0 z-[90] flex items-center justify-center bg-inverse-surface/40 p-4">
    <div class="bg-surface rounded-xl shadow-[0px_4px_20px_rgba(0,95,115,0.15)] border border-outline-variant/20 w-full max-w-sm p-6">
      <h3 class="font-headline-md text-headline-md text-on-surface mb-2">{{ title }}</h3>
      <p class="font-body-md text-body-md text-on-surface-variant mb-6">{{ message }}</p>
      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="cancelled.emit()"
          class="px-4 py-2 border border-outline-variant text-on-surface-variant font-body-md text-body-md rounded-lg hover:bg-surface-container-low transition-colors"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="confirmed.emit()"
          class="px-4 py-2 font-body-md text-body-md rounded-lg text-on-primary transition-colors"
          [class]="danger ? 'bg-error hover:opacity-90' : 'bg-primary hover:bg-primary-container'"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
